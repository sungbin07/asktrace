[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asktrace"
version = "0.1.0"
description = "Measure how your knowledge accumulates from the questions you ask LLMs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sungbin Yoon" }]
keywords = ["llm", "learning", "knowledge", "claude", "chatgpt", "analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1.0", "pydantic>=2"]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=1.0", "pydantic>=2"]

[project.scripts]
asktrace = "asktrace.cli:main"

[project.urls]
Homepage = "https://github.com/sungbin07/asktrace"
Issues = "https://github.com/sungbin07/asktrace/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/asktrace"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/asktrace/tagger/heuristic.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
